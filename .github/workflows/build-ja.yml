name: Build JA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン (空欄で本家最新を自動取得、例: 0.15.0-ja)'
        required: false
        default: ''

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Resolve version
      id: ver
      run: |
        if [ -z "${{ github.event.inputs.version }}" ]; then
          TAG=$(curl -s https://api.github.com/repos/Kvan7/Exiled-Exchange-2/releases/latest | jq -r .tag_name | sed 's/^v//')
          echo "version=${TAG}-ja" >> $GITHUB_OUTPUT
        else
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        fi

    - name: Apply patch
      run: python patch_ee2.py ${{ github.workspace }}

    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: npm ci
      working-directory: ./renderer
    - run: npm run make-index-files
      working-directory: ./renderer
    - run: npm run build
      working-directory: ./renderer
    - uses: actions/upload-artifact@v4
      with:
        name: renderer-dist
        path: ./renderer/dist
        retention-days: 1

  package:
    needs: renderer
    strategy:
      matrix:
        os: [windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Apply patch
      run: python patch_ee2.py ${{ github.workspace }}

    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - uses: actions/download-artifact@v4
      with:
        name: renderer-dist
        path: ./renderer/dist
    - run: npm ci
      working-directory: ./main
    - run: npm run build
      working-directory: ./main
    - run: npm run package
      working-directory: ./main
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Upload Windows installer
      if: startsWith(matrix.os, 'windows')
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: main/dist/*.exe
    - name: Upload Linux package
      if: startsWith(matrix.os, 'ubuntu')
      uses: actions/upload-artifact@v4
      with:
        name: linux-package
        path: main/dist/*.AppImage
    - name: Upload macOS package
      if: startsWith(matrix.os, 'macos')
      uses: actions/upload-artifact@v4
      with:
        name: macos-package
        path: main/dist/*.dmg
